<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>❤</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #050008; }

  #canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    display: block;
    z-index: 0;
  }

  #heart-wrap {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 1;
    cursor: pointer;
    transition: transform 0.15s ease;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  #heart-wrap:active { transform: translate(-50%, -50%) scale(0.95); }

  #heart-svg {
    width: 160px; height: 160px;
    display: block;
    filter: drop-shadow(0 0 40px rgba(255, 50, 100, 0.4)) drop-shadow(0 0 80px rgba(200, 50, 255, 0.2));
    animation: beat 1.2s ease-in-out infinite;
  }
  @keyframes beat {
    0%, 100% { transform: scale(1); }
    14% { transform: scale(1.15); }
    28% { transform: scale(1); }
    42% { transform: scale(1.08); }
    56% { transform: scale(1); }
  }

  .heart-path {
    fill: url(#heart-grad);
    stroke: none;
  }

  #hint {
    position: fixed;
    bottom: 12%;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1;
    color: rgba(255, 255, 255, 0.25);
    font: 300 14px/1.4 system-ui, -apple-system, sans-serif;
    letter-spacing: 0.1em;
    text-align: center;
    pointer-events: none;
    animation: hintPulse 2s ease-in-out infinite;
    white-space: nowrap;
  }
  @keyframes hintPulse {
    0%, 100% { opacity: 0.25; }
    50% { opacity: 0.6; }
  }

  #message {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 2;
    text-align: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.8s ease;
  }
  #message.show {
    opacity: 1;
  }
  #message .main {
    font: 600 clamp(36px, 10vw, 72px) system-ui, -apple-system, sans-serif;
    color: #fff;
    letter-spacing: 0.05em;
    text-shadow: 0 0 40px rgba(255, 50, 100, 0.6), 0 0 80px rgba(200, 50, 255, 0.3);
  }
  #message .main .heart-emoji {
    display: inline-block;
    animation: floatHeart 2s ease-in-out infinite;
  }
  @keyframes floatHeart {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-8px) scale(1.1); }
  }
  #message .sub {
    margin-top: 12px;
    font: 300 16px/1.4 system-ui, -apple-system, sans-serif;
    color: rgba(255, 255, 255, 0.5);
    letter-spacing: 0.15em;
  }

  @media (max-width: 480px) {
    #heart-svg { width: 120px; height: 120px; }
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="heart-wrap">
  <svg id="heart-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="heart-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ff4081" />
        <stop offset="35%" stop-color="#ff1744" />
        <stop offset="65%" stop-color="#d500f9" />
        <stop offset="100%" stop-color="#ff6b9d" />
      </linearGradient>
      <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ff80ab" />
        <stop offset="100%" stop-color="#ea80fc" />
      </linearGradient>
    </defs>
    <path class="heart-path" d="M50 88 C20 58, 0 38, 0 18 Q0 -2, 25 -2 Q50 -2, 50 22 Q50 -2, 75 -2 Q100 -2, 100 18 C100 38, 80 58, 50 88Z" />
  </svg>
</div>

<div id="hint">Нажми на сердце ❤</div>

<div id="message">
  <div class="main">От Ромы <span class="heart-emoji">❤</span></div>
  <div class="sub">Ты — самое прекрасное, что есть в моей жизни</div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const heartWrap = document.getElementById('heart-wrap');
const heartSvg = document.getElementById('heart-svg');
const hint = document.getElementById('hint');
const message = document.getElementById('message');

let W, H, centerX, centerY;
let particles = [];
let floatingHearts = [];
let stars = [];
let exploded = false;
let explosionDone = false;
let animFrame;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  centerX = W / 2;
  centerY = H / 2;
}
window.addEventListener('resize', resize);
resize();

// === Stars ===
function initStars() {
  stars = [];
  const count = 120;
  for (let i = 0; i < count; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.8 + 0.2,
      alpha: Math.random() * 0.7 + 0.2,
      twinkleSpeed: Math.random() * 0.02 + 0.005,
      twinklePhase: Math.random() * Math.PI * 2,
    });
  }
}
initStars();

// === Floating Hearts ===
function spawnFloatingHeart() {
  return {
    x: Math.random() * W,
    y: H + 20,
    r: Math.random() * 10 + 5,
    speed: Math.random() * 0.4 + 0.15,
    wobble: Math.random() * Math.PI * 2,
    wobbleAmp: Math.random() * 1.5 + 0.5,
    alpha: Math.random() * 0.15 + 0.05,
    phase: Math.random() * Math.PI * 2,
  };
}

for (let i = 0; i < 15; i++) {
  const h = spawnFloatingHeart();
  h.y = Math.random() * H;
  floatingHearts.push(h);
}

// === Particle System ===
function createExplosion(cx, cy) {
  const count = 500;
  const colors = ['#ff1744', '#ff4081', '#ff6b9d', '#d500f9', '#e040fb', '#ea80fc',
                  '#ffab40', '#ffd740', '#ff80ab', '#fff', '#ff5252', '#c44dff'];

  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 14 + 3;
    const type = Math.random() < 0.2 ? 'heart' : Math.random() < 0.15 ? 'star' : 'circle';

    const size = type === 'heart' ? Math.random() * 8 + 4 :
                 type === 'star'  ? Math.random() * 5 + 2 :
                                    Math.random() * 4 + 1.5;

    particles.push({
      x: cx + (Math.random() - 0.5) * 40,
      y: cy + (Math.random() - 0.5) * 40,
      vx: Math.cos(angle) * speed * (Math.random() * 0.5 + 0.75),
      vy: Math.sin(angle) * speed * (Math.random() * 0.5 + 0.75) - Math.random() * 4,
      size: size,
      color: colors[Math.floor(Math.random() * colors.length)],
      life: 1,
      decay: Math.random() * 0.006 + 0.003,
      type: type,
      rotation: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.3,
      gravity: 0.06 + Math.random() * 0.06,
      friction: 0.99 - Math.random() * 0.01,
      trail: [],
      maxTrail: Math.random() < 0.3 ? Math.floor(Math.random() * 4 + 2) : 0,
      glow: Math.random() < 0.25,
    });
  }
}

function drawHeart(ctx, x, y, size, color, alpha, rotation) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rotation || 0);
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  const s = size;
  ctx.beginPath();
  ctx.moveTo(0, s * 0.7);
  ctx.bezierCurveTo(-s * 0.5, s * 0.3, -s * 0.8, 0, -s * 0.8, -s * 0.4);
  ctx.bezierCurveTo(-s * 0.8, -s * 0.8, -s * 0.35, -s * 0.9, 0, -s * 0.5);
  ctx.bezierCurveTo(s * 0.35, -s * 0.9, s * 0.8, -s * 0.8, s * 0.8, -s * 0.4);
  ctx.bezierCurveTo(s * 0.8, 0, s * 0.5, s * 0.3, 0, s * 0.7);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawStar(ctx, x, y, size, color, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  ctx.translate(x, y);
  ctx.beginPath();
  const spikes = 5;
  const outerR = size;
  const innerR = size * 0.4;
  for (let i = 0; i < spikes * 2; i++) {
    const r = i % 2 === 0 ? outerR : innerR;
    const angle = (i * Math.PI) / spikes - Math.PI / 2;
    if (i === 0) ctx.moveTo(Math.cos(angle) * r, Math.sin(angle) * r);
    else ctx.lineTo(Math.cos(angle) * r, Math.sin(angle) * r);
  }
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.vx *= p.friction;
    p.vy += p.gravity;
    p.x += p.vx;
    p.y += p.vy;
    p.life -= p.decay;
    p.rotation += p.rotSpeed;

    if (p.maxTrail > 0) {
      p.trail.push({ x: p.x, y: p.y });
      if (p.trail.length > p.maxTrail) p.trail.shift();
    }

    if (p.life <= 0 || p.y > H + 50 || p.x < -50 || p.x > W + 50) {
      particles.splice(i, 1);
    }
  }
}

function drawParticles() {
  for (const p of particles) {
    const alpha = Math.max(0, p.life);

    // Trail
    for (let t = 0; t < p.trail.length; t++) {
      const trailAlpha = (t / p.trail.length) * alpha * 0.3;
      ctx.beginPath();
      ctx.arc(p.trail[t].x, p.trail[t].y, p.size * 0.5 * (t / p.trail.length), 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = trailAlpha;
      ctx.fill();
    }

    ctx.globalAlpha = alpha;

    if (p.glow) {
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 15;
    }

    if (p.type === 'heart') {
      drawHeart(ctx, p.x, p.y, p.size, p.color, alpha, p.rotation);
    } else if (p.type === 'star') {
      drawStar(ctx, p.x, p.y, p.size, p.color, alpha);
    } else {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.fill();

      if (p.size > 3) {
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.arc(p.x - p.size * 0.25, p.y - p.size * 0.25, p.size * 0.3, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.fill();
      }
    }

    ctx.shadowBlur = 0;
    ctx.shadowColor = 'transparent';
  }
  ctx.globalAlpha = 1;
}

function updateFloatingHearts() {
  for (const h of floatingHearts) {
    h.y -= h.speed;
    h.wobble += 0.02;
    h.x += Math.sin(h.wobble) * h.wobbleAmp;
    if (h.y < -30) {
      h.y = H + 20;
      h.x = Math.random() * W;
    }
  }
}

function drawFloatingHearts() {
  for (const h of floatingHearts) {
    drawHeart(ctx, h.x, h.y, h.r, 'rgba(255, 100, 150, ' + h.alpha + ')', h.alpha, 0);
  }
}

function drawStars() {
  for (const s of stars) {
    const twinkle = Math.sin(Date.now() * s.twinkleSpeed + s.twinklePhase) * 0.3 + 0.7;
    const alpha = s.alpha * twinkle;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
    ctx.fill();
  }
}

function drawBackground() {
  const grad = ctx.createRadialGradient(W * 0.5, H * 0.4, 0, W * 0.5, H * 0.4, Math.max(W, H) * 0.8);
  grad.addColorStop(0, '#1a0030');
  grad.addColorStop(0.2, '#120020');
  grad.addColorStop(0.5, '#0a0015');
  grad.addColorStop(1, '#050008');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Nebula glow behind heart
  const nebula = ctx.createRadialGradient(centerX, centerY - 20, 0, centerX, centerY - 20, 180);
  nebula.addColorStop(0, 'rgba(255, 50, 100, 0.05)');
  nebula.addColorStop(0.5, 'rgba(200, 50, 200, 0.03)');
  nebula.addColorStop(1, 'rgba(255, 50, 100, 0)');
  ctx.fillStyle = nebula;
  ctx.fillRect(0, 0, W, H);
}

let clickTime = 0;

function handleClick(e) {
  if (exploded) return;
  exploded = true;

  // Hide heart and hint
  heartWrap.style.transition = 'transform 0.6s cubic-bezier(0.68, -0.55, 0.27, 1.55), opacity 0.3s ease';
  heartWrap.style.transform = 'translate(-50%, -50%) scale(1.5)';
  setTimeout(() => {
    heartWrap.style.opacity = '0';
    heartWrap.style.transform = 'translate(-50%, -50%) scale(0)';
  }, 200);

  hint.style.transition = 'opacity 0.4s ease';
  hint.style.opacity = '0';

  // Get heart position for explosion origin
  const rect = heartWrap.getBoundingClientRect();
  const ex = rect.left + rect.width / 2;
  const ey = rect.top + rect.height / 2 + 10;

  createExplosion(ex, ey);

  clickTime = Date.now();
}

heartWrap.addEventListener('click', handleClick);
heartWrap.addEventListener('touchend', (e) => {
  e.preventDefault();
  handleClick(e);
});

// === Main Loop ===
function loop() {
  drawBackground();
  drawStars();
  updateFloatingHearts();
  drawFloatingHearts();

  if (particles.length > 0 || exploded) {
    updateParticles();
    drawParticles();
  }

  // Show message after explosion settles
  if (exploded && !explosionDone && clickTime > 0) {
    let aliveBig = false;
    for (const p of particles) {
      if (p.size > 6) { aliveBig = true; break; }
    }
    if (!aliveBig && Date.now() - clickTime > 500) {
      explosionDone = true;
      message.classList.add('show');
    }
  }

  if (exploded && explosionDone && particles.length === 0 && window.innerWidth <= 480) {
    // Gentle idle
  }

  animFrame = requestAnimationFrame(loop);
}

loop();

// Resize handler for stars
window.addEventListener('resize', () => {
  resize();
  initStars();
});

// Preload hint auto-hide after 8 sec if not clicked
setTimeout(() => {
  if (!exploded) {
    hint.style.transition = 'opacity 2s ease';
    hint.style.opacity = '0.08';
  }
}, 8000);

// Debug: make stars re-init on orientation change
window.addEventListener('orientationchange', () => {
  setTimeout(() => { resize(); initStars(); }, 300);
});
</script>
</body>
</html>
